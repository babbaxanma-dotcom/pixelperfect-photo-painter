<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AB Bouw Groep — website tijdelijk offline</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root { --ink:#0a1628; --goud:#d98c03; --zacht:#c3cbd6; --lijn:rgba(255,255,255,.14); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body {
    background: var(--ink);
    color: #fff;
    font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: 28px;
  }
  .kaart { width: 100%; max-width: 560px; text-align: left; }
  .merk {
    font-size: 13px; letter-spacing: .16em; text-transform: uppercase;
    font-weight: 700; color: var(--goud); margin: 0 0 26px;
  }
  h1 { font-size: 34px; line-height: 1.18; letter-spacing: -.02em; margin: 0 0 14px; font-weight: 700; }
  p  { font-size: 17px; line-height: 1.6; color: var(--zacht); margin: 0 0 26px; }
  .lijn { height:1px; background: var(--lijn); margin: 28px 0; border: 0; }
  .rij { display: flex; flex-wrap: wrap; gap: 12px; }
  .knop {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--goud); color: var(--ink);
    font-weight: 700; font-size: 16px; text-decoration: none;
    padding: 14px 22px; border-radius: 10px;
  }
  .knop:hover { background: #b87502; }
  .knop--rand { background: transparent; color: #fff; border: 1px solid var(--lijn); }
  .knop--rand:hover { border-color: rgba(255,255,255,.4); background: rgba(255,255,255,.05); }
  .voet { font-size: 14px; color: #8c95a3; margin: 0; }
  a:focus-visible, .knop:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  @media (max-width: 480px) {
    h1 { font-size: 27px; }
    p  { font-size: 16px; }
    .knop { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
  <main class="kaart">
    <p class="merk">AB Bouw Groep</p>
    <h1>De website is even offline</h1>
    <p>We werken aan de site. Voor een offerte, een afspraak of een lopende werf bereikt u ons gewoon rechtstreeks.</p>
    <div class="rij">
      <a class="knop" href="tel:+32460207788">Bel 0460 20 77 88</a>
      <a class="knop knop--rand" href="mailto:info@abgroep.be">info@abgroep.be</a>
    </div>
    <hr class="lijn">
    <p class="voet">AB Bouw Groep · August van Landeghemstraat 63, 2830 Willebroek</p>
  </main>
